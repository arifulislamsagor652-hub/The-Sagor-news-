<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sagor News — খবর সব এক ঠিকানায়</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 10px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        /* Header Section */
        .header {
            text-align: center;
            padding: 10px 0 5px;
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            color: #d32f2f;
            letter-spacing: -0.5px;
        }

        .tagline {
            font-size: 13px;
            color: #666;
            margin-top: -2px;
        }

        .date-bar {
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            margin: 12px 0;
            color: #444;
        }

        /* Quick Emergency Bar */
        .info-grid {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
            margin-bottom: 12px;
        }

        .info-card {
            min-width: 90px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 6px;
            text-align: center;
            font-size: 11px;
            background: #fafafa;
            flex-shrink: 0;
        }

        .info-card span {
            display: block;
            font-weight: bold;
            color: #000;
            font-size: 13px;
        }

        .live-status {
            font-size: 12px;
            color: #2e7d32;
            text-align: center;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .live-dot {
            height: 8px;
            width: 8px;
            background-color: #2e7d32;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
        }

        /* Filter Selector */
        .filter-box {
            width: 100%;
            padding: 10px 12px;
            background: #f8f9fa;
            border: 1px solid #dadce0;
            border-radius: 6px;
            font-size: 14px;
            color: #1a73e8;
            font-weight: bold;
            margin-bottom: 15px;
            outline: none;
            cursor: pointer;
        }

        /* Section Heading */
        .section-title {
            font-size: 18px;
            font-weight: bold;
            border-bottom: 2px solid #222;
            padding-bottom: 6px;
            margin-bottom: 10px;
        }

        /* News List */
        .news-item {
            border-bottom: 1px solid #eee;
            padding: 12px 0;
        }

        .news-item:last-child {
            border-bottom: none;
        }

        .news-title {
            font-size: 16px;
            font-weight: 700;
            color: #111;
            text-decoration: none;
            display: block;
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .news-title:hover {
            color: #d32f2f;
        }

        .news-meta {
            font-size: 12px;
            color: #777;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .source-tag {
            font-weight: bold;
            color: #000;
            background: #eee;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .loading-text {
            text-align: center;
            color: #666;
            padding: 20px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo Header -->
        <div class="header">
            <div class="logo">দ্য সাগর নিউজ</div>
            <div class="tagline">— খবর সব এক ঠিকানায় —</div>
        </div>

        <!-- Date Bar -->
        <div class="date-bar" id="current-date">
            লোড হচ্ছে...
        </div>

        <!-- Emergency Services -->
        <div class="info-grid">
            <div class="info-card">ℹ️️ <span>৩৩৩</span>তথ্যসেবা</div>
            <div class="info-card">🚨 <span>৯৯৯</span>জরুরি</div>
            <div class="info-card">🚒 <span>১০২</span>ফায়ার</div>
            <div class="info-card">⚖️ <span>১০৩</span>আইনি সহায়তা</div>
        </div>

        <!-- Live Status -->
        <div class="live-status">
            <span class="live-dot"></span> সর্বশেষ আপডেট: <span id="live-time"></span>
        </div>

        <!-- Filter Dropdown -->
        <select class="filter-box" id="sourceFilter" onchange="filterNews()">
            <option value="all">উৎস নির্বাচন: সকল সংবাদপত্র</option>
            <option value="আগামীর সময়">দৈনিক আগামীর সময়</option>
            <option value="Dhaka Post">ঢাকা পোস্ট</option>
            <option value="Samakal">সমকাল</option>
        </select>

        <!-- Section Title -->
        <div class="section-title">সর্বশেষ খবর</div>

        <!-- News Feed Container -->
        <div class="news-list" id="newsFeed">
            <div class="loading-text">খবর লোড করা হচ্ছে...</div>
        </div>
    </div>

    <script>
        // আজকের তারিখ ও সময়
        function updateDateTime() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('current-date').innerText = now.toLocaleDateString('bn-BD', options);
            document.getElementById('live-time').innerText = now.toLocaleTimeString('bn-BD');
        }
        updateDateTime();

        let allNews = [];

        // RSS Feeds থেকে খবর আনার ফাংশন
        async function fetchNews() {
            const feeds = [
                { name: 'আগামীর সময়', url: 'https://www.agamirshomoy.com/rss' },
                { name: 'Dhaka Post', url: 'https://www.dhakapost.com/rss' },
                { name: 'Samakal', url: 'https://samakal.com/rss' }
            ];

            allNews = [];

            for (let feed of feeds) {
                try {
                    // CORS Bypass Proxy
                    const apiUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(feed.url)}`;
                    let res = await fetch(apiUrl);
                    let data = await res.json();
                    
                    if (data.contents) {
                        let parser = new DOMParser();
                        let xmlDoc = parser.parseFromString(data.contents, "text/xml");
                        let items = xmlDoc.querySelectorAll("item");

                        items.forEach(item => {
                            let title = item.querySelector("title") ? item.querySelector("title").textContent : '';
                            let link = item.querySelector("link") ? item.querySelector("link").textContent : '#';
                            let pubDateText = item.querySelector("pubDate") ? item.querySelector("pubDate").textContent : '';
                            
                            allNews.push({
                                title: title,
                                link: link,
                                pubDate: pubDateText ? new Date(pubDateText) : new Date(),
                                source: feed.name
                            });
                        });
                    }
                } catch (e) {
                    console.log('Error fetching feed for ' + feed.name, e);
                }
            }

            // সময় অনুযায়ী সাজানো (নতুন খবর সবার উপরে)
            allNews.sort((a, b) => b.pubDate - a.pubDate);
            renderNews(allNews);
        }

        // স্ক্রিনে খবর দেখানোর ফাংশন
        function renderNews(newsList) {
            const container = document.getElementById('newsFeed');
            container.innerHTML = '';

            if (newsList.length === 0) {
                container.innerHTML = '<div class="loading-text">কোনো খবর পাওয়া যায়নি। অনুগ্রহ করে পেজ রিফ্রেশ করুন।</div>';
                return;
            }

            newsList.slice(0, 25).forEach(item => {
                const timeAgo = getTimeAgo(item.pubDate);
                const html = `
                    <div class="news-item">
                        <a href="${item.link}" target="_blank" class="news-title">${item.title}</a>
                        <div class="news-meta">
                            <span class="source-tag">${item.source}</span>
                            <span>• ${timeAgo}</span>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        // উৎস অনুযায়ী ফিল্টার করা
        function filterNews() {
            const selected = document.getElementById('sourceFilter').value;
            if (selected === 'all') {
                renderNews(allNews);
            } else {
                const filtered = allNews.filter(item => item.source === selected);
                renderNews(filtered);
            }
        }

        // সময় হিসাব করার ফাংশন
        function getTimeAgo(date) {
            const minutes = Math.floor((new Date() - date) / 6
